<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Macintosh HD — Henrique V.</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          boxShadow: {
            'mac-window': '0 22px 70px 4px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.15)',
            'mac-window-light': '0 20px 60px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.08)',
            'mac-menu': '0 10px 35px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.15)',
            'mac-dock': '0 10px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 0 rgba(255, 255, 255, 0.35)',
          }
        }
      }
    };
  </script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    input, textarea, .selectable {
      user-select: text;
      -webkit-user-select: text;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }

    /* Wallpapers estilo macOS Sonoma / Sequoia / Ventura / Big Sur */
    .wallpaper-sequoia {
      background: radial-gradient(circle at 20% 25%, #ff7e5f 0%, transparent 45%),
                  radial-gradient(circle at 80% 20%, #feb47b 0%, transparent 45%),
                  radial-gradient(circle at 50% 80%, #2b5876 0%, transparent 60%),
                  linear-gradient(135deg, #1e3c72 0%, #2a5298 40%, #ff6b6b 85%, #feca57 100%);
    }
    .wallpaper-sonoma {
      background: radial-gradient(circle at 75% 25%, #00d2ff 0%, transparent 50%),
                  radial-gradient(circle at 25% 75%, #3a7bd5 0%, transparent 55%),
                  radial-gradient(circle at 50% 50%, #f7971e 0%, transparent 45%),
                  linear-gradient(125deg, #0f2027 0%, #203a43 45%, #2c5364 100%);
    }
    .wallpaper-monterey {
      background: radial-gradient(circle at 80% 15%, #ff0080 0%, transparent 45%),
                  radial-gradient(circle at 20% 85%, #7928ca 0%, transparent 50%),
                  linear-gradient(135deg, #140024 0%, #3b0764 50%, #9d174d 100%);
    }
    .wallpaper-ventura {
      background: radial-gradient(circle at 70% 20%, #fde047 0%, transparent 40%),
                  radial-gradient(circle at 30% 60%, #f97316 0%, transparent 55%),
                  linear-gradient(160deg, #1e1b4b 0%, #312e81 45%, #ea580c 100%);
    }
    .wallpaper-aurora {
      background: radial-gradient(circle at 25% 20%, #10b981 0%, transparent 45%),
                  radial-gradient(circle at 80% 70%, #3b82f6 0%, transparent 50%),
                  linear-gradient(135deg, #020617 0%, #064e3b 50%, #1e3a8a 100%);
    }

    /* Glassmorphism utilitários */
    .glass-bar {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }
    .dark .glass-bar {
      background: rgba(24, 24, 28, 0.55);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    .glass-panel {
      background: rgba(246, 246, 248, 0.82);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
    }
    .dark .glass-panel {
      background: rgba(30, 30, 34, 0.82);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
    }

    .glass-dock {
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
    }
    .dark .glass-dock {
      background: rgba(22, 22, 26, 0.42);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
    }

    /* Animações de janela */
    @keyframes windowOpen {
      0% { opacity: 0; transform: scale(0.92) translateY(14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .window-animate-in {
      animation: windowOpen 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Scrollbars estilo macOS */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(128, 128, 128, 0.55);
    }

    /* Handles de redimensionamento */
    .resize-handle {
      position: absolute;
      z-index: 30;
    }
    .resize-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
    .resize-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
    .resize-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
    .resize-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
    .resize-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .resize-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resize-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .resize-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

    /* Animação do equalizador de música */
    @keyframes eqBar {
      0%, 100% { height: 25%; }
      50% { height: 95%; }
    }
    .eq-playing div:nth-child(1) { animation: eqBar 0.6s ease-in-out infinite; }
    .eq-playing div:nth-child(2) { animation: eqBar 0.45s ease-in-out infinite 0.15s; }
    .eq-playing div:nth-child(3) { animation: eqBar 0.7s ease-in-out infinite 0.3s; }
    .eq-playing div:nth-child(4) { animation: eqBar 0.5s ease-in-out infinite 0.1s; }

    #top-menubar{padding-top:env(safe-area-inset-top,0px);height:calc(1.75rem + env(safe-area-inset-top,0px))}
    #mac-dock{margin-bottom:env(safe-area-inset-bottom,0px)}
    /* Dock bounce */
    @keyframes dockBounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-18px); }
      70% { transform: translateY(-6px); }
    }
    .dock-bouncing {
      animation: dockBounce 0.65s ease;
    }
  </style>
</head>
<body class="dark">
  <!-- Camada de Brilho da Tela -->
  <div id="brightness-overlay" class="fixed inset-0 bg-black pointer-events-none z-[9998] transition-opacity duration-150" style="opacity: 0;"></div>

  <!-- TELA DE BOOT / LOGIN -->
  <div id="lock-screen" class="fixed inset-0 z-[9000] wallpaper-sequoia flex flex-col items-center justify-between py-14 px-6 text-white transition-all duration-500">
    <!-- Relógio Superior Estilo macOS Sonoma/Sequoia -->
    <div class="flex flex-col items-center mt-4 drop-shadow-md">
      <div id="lock-date" class="text-lg sm:text-xl font-medium opacity-90 tracking-tight">Terça-feira, 17 de novembro</div>
      <div id="lock-time" class="text-7xl sm:text-8xl font-bold tracking-tight leading-none mt-1">20:19</div>
    </div>

    <!-- Perfil do Usuário -->
    <div class="flex flex-col items-center mb-6">
      <div class="group flex flex-col items-center">
        <div class="w-24 h-24 rounded-full p-1 bg-white/25 backdrop-blur-md shadow-2xl transition-transform duration-300 group-hover:scale-105">
          <div class="w-full h-full rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 flex items-center justify-center text-3xl font-bold text-white shadow-inner">
            <span>H</span>
          </div>
        </div>
        <h2 class="mt-3 text-lg font-semibold tracking-tight drop-shadow">Henrique Vasconcelos</h2>
      </div>

      <form onsubmit="handleLoginSubmit(event)" class="mt-3 flex items-center gap-2">
        <input
          id="lock-password"
          type="password"
          placeholder="Digite a senha"
          class="w-56 px-3.5 py-1.5 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-sm text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white/60 text-center"
        />
        <button
          type="submit"
          title="Entrar"
          class="w-8 h-8 rounded-full bg-white/25 hover:bg-white/40 backdrop-blur-md border border-white/30 flex items-center justify-center transition"
        >
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </button>
      </form>
      <div id="lock-msg" class="mt-3 h-5 text-sm text-white/90"></div><button type="button" onclick="lockMsg('O mensageiro')" class="text-xs text-white/80 hover:text-white underline underline-offset-2 transition">Mostrar dica de senha</button>
    </div>
  </div>

  <!-- ÁREA PRINCIPAL DO DESKTOP -->
  <div id="desktop-root" class="relative w-full h-full wallpaper-sequoia overflow-hidden transition-all duration-500">
    
    <!-- BARRA DE MENU SUPERIOR (MENU BAR) -->
    <header id="top-menubar" class="fixed top-0 left-0 right-0 h-7 glass-bar border-b border-black/10 dark:border-white/10 z-[5000] px-2 sm:px-3 flex items-center justify-between text-[13px] text-gray-900 dark:text-white">
      <!-- Esquerda: Apple Logo + App Ativo + Menus -->
      <div class="flex items-center h-full space-x-0.5 sm:space-x-1">
        <!-- Menu Apple -->
        <div class="relative h-full flex items-center">
          <button onclick="toggleMenuDropdown('apple-menu', event)" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 flex items-center justify-center transition">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 170 170">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.13-1.9-14.34-6.08-3.69-3.03-7.61-7.8-11.77-14.33-5.04-7.82-9.18-16.88-12.42-27.18-3.24-10.3-4.86-20.14-4.86-29.52 0-11.2 2.81-20.47 8.42-27.81 5.62-7.34 12.69-11.12 21.22-11.34 4.35 0 9.4 1.32 15.16 3.96 5.75 2.64 9.45 3.99 11.08 4.06 1.33 0 5.36-1.56 12.09-4.68 6.73-3.12 12.42-4.47 17.07-4.05 12.83 1.04 22.49 6.09 28.98 15.16-11.49 6.96-17.16 16.65-17.01 29.07.14 9.69 3.74 17.75 10.8 24.18 4.86 4.49 10.56 7.36 17.09 8.62-1.36 4.31-2.92 8.48-4.68 12.51zM119.22 31.19c0 7.62-2.78 14.74-8.34 21.35-6.7 7.83-14.81 12.35-23.62 11.63-.12-.93-.19-1.92-.19-2.97 0-7.32 3.19-15.15 8.86-21.56 2.83-3.25 6.43-5.95 10.8-8.1 4.36-2.14 8.49-3.33 12.39-3.57.07 1.11.1 2.18.1 3.22z"/>
            </svg>
          </button>
          <!-- Dropdown Apple -->
          <div id="apple-menu" class="menu-dropdown hidden absolute top-7 left-0 w-56 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 text-[13px] z-[6000]">
            <button onclick="openAboutMac(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex items-center justify-between">
              <span>Sobre Este Mac</span>
            </button>
            <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
            <button onclick="openApp('settings'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex items-center justify-between">
              <span>Ajustes do Sistema...</span>
            </button>
            <button onclick="openSpotlight(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex items-center justify-between">
              <span>App Store...</span>
              <span class="text-[11px] opacity-60">⌘Espaço</span>
            </button>
            <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
            <button onclick="lockMac(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex items-center justify-between">
              <span>Bloquear Tela</span>
              <span class="text-[11px] opacity-60">⌃⌘Q</span>
            </button>
            <button onclick="restartMac(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex items-center justify-between">
              <span>Reiniciar...</span>
            </button>
          </div>
        </div>

        <!-- Nome do App Ativo -->
        <div class="relative h-full flex items-center">
          <button onclick="toggleMenuDropdown('app-menu', event)" id="active-app-name" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 font-bold tracking-tight transition">
            Finder
          </button>
          <div id="app-menu" class="menu-dropdown hidden absolute top-7 left-0 w-52 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 text-[13px] z-[6000]">
            <button onclick="openAboutMac(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Sobre <span id="menu-about-app-name">Finder</span></button>
            <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
            <button onclick="openApp('settings'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Preferências...</button>
            <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
            <button onclick="closeActiveWindow(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between">
              <span>Encerrar Aplicativo</span>
              <span class="text-[11px] opacity-60">⌘Q</span>
            </button>
          </div>
        </div>

        <!-- Menus Contextuais (Arquivo, Editar, Visualizar, Janela, Ajuda) -->
        <div class="hidden md:flex items-center space-x-0.5">
          <!-- Arquivo -->
          <div class="relative">
            <button onclick="toggleMenuDropdown('file-menu', event)" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 transition">Arquivo</button>
            <div id="file-menu" class="menu-dropdown hidden absolute top-7 left-0 w-52 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 z-[6000]">
              <button onclick="openApp('finder'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Nova Janela do Finder</span><span class="text-[11px] opacity-60">⌘N</span></button>
              <button onclick="createDesktopFolder(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Nova Pasta</span><span class="text-[11px] opacity-60">⇧⌘N</span></button>
              <button onclick="openApp('notes'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Nova Nota</button>
              <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
              <button onclick="closeActiveWindow(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Fechar Janela</span><span class="text-[11px] opacity-60">⌘W</span></button>
            </div>
          </div>

          <!-- Editar -->
          <div class="relative">
            <button onclick="toggleMenuDropdown('edit-menu', event)" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 transition">Editar</button>
            <div id="edit-menu" class="menu-dropdown hidden absolute top-7 left-0 w-48 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 z-[6000]">
              <button onclick="document.execCommand('undo'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Desfazer</span><span class="text-[11px] opacity-60">⌘Z</span></button>
              <button onclick="document.execCommand('redo'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Refazer</span><span class="text-[11px] opacity-60">⇧⌘Z</span></button>
              <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
              <button onclick="document.execCommand('copy'); showToast('Copiado para a área de transferência'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Copiar</span><span class="text-[11px] opacity-60">⌘C</span></button>
              <button onclick="document.execCommand('selectAll'); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Selecionar Tudo</span><span class="text-[11px] opacity-60">⌘A</span></button>
            </div>
          </div>

          <!-- Visualizar -->
          <div class="relative">
            <button onclick="toggleMenuDropdown('view-menu', event)" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 transition">Visualizar</button>
            <div id="view-menu" class="menu-dropdown hidden absolute top-7 left-0 w-52 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 z-[6000]">
              <button onclick="toggleDarkMode(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Alternar Modo Escuro/Claro</button>
              <button onclick="cycleWallpaper(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Próximo Papel de Parede</button>
              <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
              <button onclick="toggleFullScreenBrowser(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Entrar em Tela Cheia</button>
            </div>
          </div>

          <!-- Janela -->
          <div class="relative">
            <button onclick="toggleMenuDropdown('window-menu', event)" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 transition">Janela</button>
            <div id="window-menu" class="menu-dropdown hidden absolute top-7 left-0 w-52 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 z-[6000]">
              <button onclick="minimizeActiveWindow(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white flex justify-between"><span>Minimizar</span><span class="text-[11px] opacity-60">⌘M</span></button>
              <button onclick="maximizeActiveWindow(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Ampliar / Restaurar</button>
              <div class="my-1 border-t border-black/10 dark:border-white/10"></div>
              <button onclick="tileAllWindows(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Organizar Todas as Janelas</button>
            </div>
          </div>

          <!-- Ajuda -->
          <div class="relative">
            <button onclick="toggleMenuDropdown('help-menu', event)" class="menu-trigger px-2.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 transition">Ajuda</button>
            <div id="help-menu" class="menu-dropdown hidden absolute top-7 left-0 w-52 glass-panel rounded-lg shadow-mac-menu border border-black/10 dark:border-white/15 py-1.5 z-[6000]">
              <button onclick="openSpotlight(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Busca Spotlight</button>
              <button onclick="openAboutMac(); closeAllMenus()" class="w-full text-left px-3.5 py-1 hover:bg-blue-500 hover:text-white">Dicas do macOS Web</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Direita: Status Icons + Spotlight + Control Center + Data/Hora -->
      <div class="flex items-center h-full space-x-1 sm:space-x-2">
        <!-- Bateria -->
        <div class="hidden sm:flex items-center space-x-1 px-1.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 cursor-default" title="Bateria: 98% - Carregada">
          <span class="text-[11px] font-medium opacity-85">98%</span>
          <div class="w-5 h-2.5 border border-current rounded-[3px] p-[1px] flex items-center relative">
            <div class="h-full bg-current rounded-[1px]" style="width: 95%;"></div>
            <div class="w-[2px] h-1 bg-current absolute -right-[3px] rounded-r-[1px]"></div>
          </div>
        </div>

        <!-- Wi-Fi -->
        <button onclick="toggleControlCenter(event)" id="menubar-wifi" class="px-1.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 flex items-center transition" title="Wi-Fi">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
          </svg>
        </button>

        <!-- Busca Spotlight -->
        <button onclick="openSpotlight()" class="px-1.5 h-[22px] rounded hover:bg-black/10 dark:hover:bg-white/15 flex items-center transition" title="Busca Spotlight (⌘Espaço)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>

    function filterSpotlight(query) {
      const container = document.getElementById('spotlight-results');
      const q = query.trim().toLowerCase();
      let html = '';

      // Verifica se é expressão matemática simples
      if (q && /^[0-9+\-*/().\s]+$/.test(q) && /[+\-*/]/.test(q)) {
        try {
          const res = Function('"use strict";return (' + q + ')')();
          if (typeof res === 'number' && isFinite(res)) {
            html += `
              <div onclick="openApp('calculator'); closeSpotlight()" class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-blue-500/15 border border-blue-500/30 cursor-pointer">
                <div class="flex items-center space-x-3">
                  <div class="w-8 h-8 rounded-lg bg-orange-500 text-white flex items-center justify-center font-bold">=</div>
                  <div>
                    <div class="text-sm font-semibold">${res}</div>
                    <div class="text-xs opacity-65">Resultado do cálculo (${q})</div>
                  </div>
                </div>
                <span class="text-xs opacity-60">Calculadora</span>
              </div>
            `;
          }
        } catch (e) {}
      }

      const matchedApps = APPS.filter(app => app.name.toLowerCase().includes(q));
      matchedApps.forEach((app, index) => {
        html += `
          <div onclick="openApp('${app.id}'); closeSpotlight()" class="spotlight-item flex items-center justify-between px-3 py-2 rounded-xl hover:bg-blue-500 hover:text-white cursor-pointer transition ${index === 0 && !html ? 'bg-blue-500/10' : ''}">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8">${app.icon}</div>
              <div>
                <div class="text-sm font-medium">${app.name}</div>
                <div class="text-[11px] opacity-65">Aplicativo</div>
              </div>
            </div>
            <span class="text-xs opacity-60">Abrir ↵</span>
          </div>
        `;
      });

      if (q.length > 1) {
        const seen = new Set();
        for (const k in VIRTUAL_FS) VIRTUAL_FS[k].forEach(f => {
          if (f.type === 'file' && !seen.has(f.name) && (f.name.toLowerCase().includes(q) || f.content.toLowerCase().includes(q))) {
            seen.add(f.name);
            html += `<div onclick="openApp('finder',{folder:'${k}'}); closeSpotlight()" class="spotlight-item flex items-center justify-between px-3 py-2 rounded-xl hover:bg-blue-500 hover:text-white cursor-pointer transition"><div><div class="text-sm font-medium">${f.name}</div><div class="text-[11px] opacity-65">Documento · ${k}</div></div><span class="text-xs opacity-60">Abrir ↵</span></div>`;
          }
        });
      }
      if (!html) {
        html = `<div class="text-center py-6 text-sm opacity-60">Nenhum resultado encontrado para "${query}"</div>`;
      }

      container.innerHTML = html;
    }

      const y = Math.min(e.clientY, window.innerHeight - 210);

      menu.style.top = y + 'px';

    // =========================================================================
    // DOCK INFERIOR COM MAGNIFICAÇÃO SUAVE
    // =========================================================================
    function renderDock() {
      const dock = document.getElementById('mac-dock');
      const baseSize = state.dockSize;

      dock.innerHTML = APPS.map((app, index) => {
        const isOpen = Object.values(state.windows).some(w => w.appId === app.id);
        const separator = app.id === 'settings'
          ? `<div class="h-9 w-[1px] bg-black/15 dark:bg-white/20 mx-1 self-center"></div>`
          : '';
        return `
          ${separator}
          <div class="dock-item-wrapper relative flex flex-col items-center group" data-index="${index}">
            <!-- Tooltip flutuante -->
            <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-150 pointer-events-none absolute -top-9 px-2.5 py-1 rounded-md glass-panel text-gray-900 dark:text-white text-xs font-medium whitespace-nowrap shadow-md border border-black/10 dark:border-white/15">
              ${app.name}
            </div>
            <!-- Ícone -->
            <button
              id="dock-btn-${app.id}"
              onclick="handleDockClick('${app.id}')"
              style="width: ${baseSize}px; height: ${baseSize}px;"
              class="dock-icon transition-transform duration-150 ease-out origin-bottom cursor-pointer focus:outline-none active:scale-90"
            >
              ${app.icon}
            </button>
            <!-- Indicador de App Aberto -->
            <div class="w-1 h-1 rounded-full mt-1 ${isOpen ? 'bg-gray-800 dark:bg-white' : 'bg-transparent'}"></div>
          </div>
        `;
      }).join('');

      setupDockMagnification();
    }

    function setupDockMagnification() {
      const dock = document.getElementById('mac-dock');
      const icons = dock.querySelectorAll('.dock-icon');

      dock.onmousemove = (e) => {
        icons.forEach(icon => {
          const rect = icon.getBoundingClientRect();
          const iconCenterX = rect.left + rect.width / 2;
          const distance = Math.abs(e.clientX - iconCenterX);
          const maxDistance = 130;
          if (distance < maxDistance) {
            const scale = 1 + (0.42 * Math.cos((distance / maxDistance) * (Math.PI / 2)));
            const translateY = -10 * Math.cos((distance / maxDistance) * (Math.PI / 2));
            icon.style.transform = `translateY(${translateY}px) scale(${scale})`;
          } else {
            icon.style.transform = 'translateY(0px) scale(1)';
          }
        });
      };

      dock.onmouseleave = () => {
        icons.forEach(icon => {
          icon.style.transform = 'translateY(0px) scale(1)';
        });
      };
    }

    function handleDockClick(appId) {
      const existing = Object.values(state.windows).find(w => w.appId === appId);
      if (existing) {
        if (existing.minimized) {
          existing.minimized = false;
          const el = document.getElementById(existing.id);
          if (el) el.classList.remove('hidden');
        }
        focusWindow(existing.id);
      } else {
        const btn = document.getElementById(`dock-btn-${appId}`);
        if (btn) {
          btn.classList.add('dock-bouncing');
          setTimeout(() => btn.classList.remove('dock-bouncing'), 650);
        }
        openApp(appId);
      }
    }

    // =========================================================================
    // SISTEMA COMPLETO DE JANELAS (DRAG, RESIZE, MINIMIZE, MAXIMIZE, FOCUS)
    // =========================================================================
    function openApp(appId, options = {}) {
      const app = APPS.find(a => a.id === appId);
      if (!app) return;

      // Verifica se já existe janela aberta deste app (exceto finder se quiser múltiplas, mas manteremos 1 por app para organização limpa)
      const existing = Object.values(state.windows).find(w => w.appId === appId);
      if (existing) {
        existing.minimized = false;
        const el = document.getElementById(existing.id);
        if (el) el.classList.remove('hidden');
        focusWindow(existing.id);
        if (appId === 'finder' && options.folder) {
          renderFinderContent(existing.id, options.folder);
        }
        return existing.id;
      }

      const winId = 'win-' + appId + '-' + Date.now();
      const offset = (Object.keys(state.windows).length % 6) * 28;
      const width = Math.min(app.defaultWidth, window.innerWidth - 24);
      const height = Math.min(app.defaultHeight, window.innerHeight - 120);
      const x = Math.max(12, Math.round((window.innerWidth - width) / 2 + offset - 30));
      const y = Math.max(38, Math.round((window.innerHeight - height) / 2 + offset - 30));

      const winObj = {
        id: winId,
        appId: app.id,
        title: app.name,
        x,
        y,
        width,
        height,
        minimized: false,
        maximized: false,
        prevRect: null
      };

      state.windows[winId] = winObj;
      createWindowElement(winObj, options);
      focusWindow(winId);
      renderDock();
      return winId;
    }

    function createWindowElement(winObj, options = {}) {
      const container = document.getElementById('windows-container');
      const winEl = document.createElement('div');
      winEl.id = winObj.id;
      winEl.style.left = winObj.x + 'px';
      winEl.style.top = winObj.y + 'px';
      winEl.style.width = winObj.width + 'px';
      winEl.style.height = winObj.height + 'px';
      winEl.className = 'pointer-events-auto absolute rounded-xl glass-panel shadow-mac-window-light dark:shadow-mac-window border border-black/15 dark:border-white/15 flex flex-col overflow-hidden text-gray-900 dark:text-white window-animate-in';

      winEl.addEventListener('mousedown', () => focusWindow(winObj.id));
      winEl.addEventListener('touchstart', () => focusWindow(winObj.id), { passive: true });

      winEl.innerHTML = `
        <!-- Handles de Redimensionamento -->
        <div class="resize-handle resize-n" data-dir="n"></div>
        <div class="resize-handle resize-s" data-dir="s"></div>
        <div class="resize-handle resize-e" data-dir="e"></div>
        <div class="resize-handle resize-w" data-dir="w"></div>
        <div class="resize-handle resize-nw" data-dir="nw"></div>
        <div class="resize-handle resize-ne" data-dir="ne"></div>
        <div class="resize-handle resize-sw" data-dir="sw"></div>
        <div class="resize-handle resize-se" data-dir="se"></div>

        <!-- Barra de Título Estilo macOS -->
        <div
          id="${winObj.id}-titlebar"
          ondblclick="toggleMaximizeWindow('${winObj.id}')"
          class="h-10 px-3.5 flex items-center justify-between border-b border-black/10 dark:border-white/10 bg-white/40 dark:bg-white/[0.03] shrink-0 cursor-default"
        >
          <!-- Botões Semáforo -->
          <div class="flex items-center space-x-2 group z-10">
            <button onclick="closeWindow('${winObj.id}'); event.stopPropagation();" title="Fechar" class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e] flex items-center justify-center text-[9px] text-black/70 font-bold">
              <span class="opacity-0 group-hover:opacity-100 leading-none">×</span>
            </button>
            <button onclick="minimizeWindow('${winObj.id}'); event.stopPropagation();" title="Minimizar" class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123] flex items-center justify-center text-[9px] text-black/70 font-bold">
              <span class="opacity-0 group-hover:opacity-100 leading-none">−</span>
            </button>
            <button onclick="toggleMaximizeWindow('${winObj.id}'); event.stopPropagation();" title="Ampliar" class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29] flex items-center justify-center text-[8px] text-black/70 font-bold">
              <span class="opacity-0 group-hover:opacity-100 leading-none">+</span>
            </button>
          </div>

          <!-- Título Central -->
          <div class="text-[13px] font-semibold opacity-85 truncate pointer-events-none">
            ${winObj.title}
          </div>

          <div class="w-12"></div>
        </div>

        <!-- Conteúdo do Aplicativo -->
        <div id="${winObj.id}-body" class="flex-1 overflow-hidden relative flex flex-col"></div>
      `;

      container.appendChild(winEl);
      setupWindowDrag(winObj.id);
      setupWindowResize(winObj.id);
      mountAppContent(winObj.id, winObj.appId, options);
    }

    function focusWindow(winId) {
      const winObj = state.windows[winId];
      if (!winObj) return;
      state.zIndexCounter += 1;
      state.activeWindowId = winId;
      const el = document.getElementById(winId);
      if (el) el.style.zIndex = state.zIndexCounter;

      document.getElementById('active-app-name').textContent = winObj.title;
      document.getElementById('menu-about-app-name').textContent = winObj.title;
    }

    function closeWindow(winId) {
      const el = document.getElementById(winId);
      if (el) {
        el.style.transition = 'opacity 0.15s, transform 0.15s';
        el.style.opacity = '0';
        el.style.transform = 'scale(0.93)';
        setTimeout(() => el.remove(), 150);
      }
      delete state.windows[winId];
      renderDock();

      // Atualiza app ativo na barra superior
      const remaining = Object.values(state.windows).filter(w => !w.minimized);
      if (remaining.length > 0) {
        focusWindow(remaining[remaining.length - 1].id);
      } else {
        state.activeWindowId = null;
        document.getElementById('active-app-name').textContent = 'Finder';
      }
    }

    function closeActiveWindow() {
      if (state.activeWindowId) closeWindow(state.activeWindowId);
    }

    function minimizeWindow(winId) {
      const winObj = state.windows[winId];
      if (!winObj) return;
      winObj.minimized = true;
      const el = document.getElementById(winId);
      if (el) {
        el.style.transition = 'all 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
        el.style.transform = 'translateY(260px) scale(0.25)';
        el.style.opacity = '0';
        setTimeout(() => {
          el.classList.add('hidden');
          el.style.transform = '';
          el.style.opacity = '';
          el.style.transition = '';
        }, 250);
      }
    }

    function minimizeActiveWindow() {
      if (state.activeWindowId) minimizeWindow(state.activeWindowId);
    }

    function toggleMaximizeWindow(winId) {
      const winObj = state.windows[winId];
      const el = document.getElementById(winId);
      if (!winObj || !el) return;

      el.style.transition = 'all 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
      if (!winObj.maximized) {
        winObj.prevRect = { x: winObj.x, y: winObj.y, width: winObj.width, height: winObj.height };
        winObj.x = 0;
        winObj.y = 28;
        winObj.width = window.innerWidth;
        winObj.height = window.innerHeight - 102;
        winObj.maximized = true;
        el.classList.remove('rounded-xl');
      } else {
        const r = winObj.prevRect || { x: 80, y: 60, width: 680, height: 450 };
        winObj.x = r.x;
        winObj.y = r.y;
        winObj.width = r.width;
        winObj.height = r.height;
        winObj.maximized = false;
        el.classList.add('rounded-xl');
      }

      el.style.left = winObj.x + 'px';
      el.style.top = winObj.y + 'px';
      el.style.width = winObj.width + 'px';
      el.style.height = winObj.height + 'px';
      setTimeout(() => { el.style.transition = ''; }, 230);
    }

    function maximizeActiveWindow() {
      if (state.activeWindowId) toggleMaximizeWindow(state.activeWindowId);
    }

    function tileAllWindows() {
      const wins = Object.values(state.windows).filter(w => !w.minimized);
      wins.forEach((w, idx) => {
        const el = document.getElementById(w.id);
        w.maximized = false;
        w.x = 40 + idx * 45;
        w.y = 45 + idx * 35;
        if (el) {
          el.classList.add('rounded-xl');
          el.style.left = w.x + 'px';
          el.style.top = w.y + 'px';
        }
      });
    }

    // Arrastar Janela
    function setupWindowDrag(winId) {
      const titlebar = document.getElementById(`${winId}-titlebar`);
      const winEl = document.getElementById(winId);
      const winObj = state.windows[winId];

      let isDragging = false;
      let startX, startY, origX, origY;

      const onStart = (clientX, clientY) => {
        if (winObj.maximized) return;
        isDragging = true;
        startX = clientX;
        startY = clientY;
        origX = winObj.x;
        origY = winObj.y;
      };

      const onMove = (clientX, clientY) => {
        if (!isDragging) return;
        const dx = clientX - startX;
        const dy = clientY - startY;
        winObj.x = origX + dx;
        winObj.y = Math.max(28, origY + dy);
        winEl.style.left = winObj.x + 'px';
        winEl.style.top = winObj.y + 'px';
      };

      const onEnd = () => { isDragging = false; };

      titlebar.addEventListener('mousedown', (e) => {
        if (e.target.closest('button')) return;
        onStart(e.clientX, e.clientY);
      });
      document.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
      document.addEventListener('mouseup', onEnd);

      // Suporte Touch
      titlebar.addEventListener('touchstart', (e) => {
        if (e.target.closest('button')) return;
        const t = e.touches[0];
        onStart(t.clientX, t.clientY);
      }, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const t = e.touches[0];
        onMove(t.clientX, t.clientY);
      }, { passive: true });
      document.addEventListener('touchend', onEnd);
    }

    // Redimensionar Janela
    function setupWindowResize(winId) {
      const winEl = document.getElementById(winId);
      const winObj = state.windows[winId];
      const handles = winEl.querySelectorAll('.resize-handle');

      handles.forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          if (winObj.maximized) return;
          const dir = handle.dataset.dir;
          const startX = e.clientX;
          const startY = e.clientY;
          const startW = winObj.width;
          const startH = winObj.height;
          const startLeft = winObj.x;
          const startTop = winObj.y;
          const minW = 250;
          const minH = 220;

          const onMouseMove = (moveEvent) => {
            const dx = moveEvent.clientX - startX;
            const dy = moveEvent.clientY - startY;

            if (dir.includes('e')) {
              winObj.width = Math.max(minW, startW + dx);
            }
            if (dir.includes('s')) {
              winObj.height = Math.max(minH, startH + dy);
            }
            if (dir.includes('w')) {
              const newW = Math.max(minW, startW - dx);
              if (newW > minW) {
                winObj.x = startLeft + dx;
                winObj.width = newW;
              }
            }
            if (dir.includes('n')) {
              const newH = Math.max(minH, startH - dy);
              if (newH > minH && startTop + dy >= 28) {
                winObj.y = startTop + dy;
                winObj.height = newH;
              }
            }

            winEl.style.width = winObj.width + 'px';
            winEl.style.height = winObj.height + 'px';
            winEl.style.left = winObj.x + 'px';
            winEl.style.top = winObj.y + 'px';
          };

          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
      });
    }

    // =========================================================================
    // CONTEÚDO DOS APLICATIVOS
    // =========================================================================
    function mountAppContent(winId, appId, options) {
      const body = document.getElementById(`${winId}-body`);
      switch (appId) {
        case 'finder':
          mountFinder(winId, body, options.folder || 'Favoritos');
          break;
        case 'safari':
          mountSafari(winId, body);
          break;
        case 'notes':
          mountNotes(winId, body);
          break;
        case 'mail':
          mountMD(winId, body, MAIL_CFG);
          break;
        case 'terminal':
          mountTerminal(winId, body);
          break;
        case 'messages':
          mountMD(winId, body, MSG_CFG);
          break;
        case 'calendar':
          mountCalendar(winId, body);
          break;
        case 'settings':
          mountSettings(winId, body);
          break;
        case 'trash':
          mountTrash(winId, body);
          break;
      }
    }

    const calcState = { display: '0', prev: null, op: null, resetNext: false };

    function mountCalculator(winId, body) {
      const buttons = [
        { label: 'AC', type: 'func' }, { label: '+/-', type: 'func' }, { label: '%', type: 'func' }, { label: '÷', type: 'op' },
        { label: '7', type: 'num' }, { label: '8', type: 'num' }, { label: '9', type: 'num' }, { label: '×', type: 'op' },
        { label: '4', type: 'num' }, { label: '5', type: 'num' }, { label: '6', type: 'num' }, { label: '−', type: 'op' },
        { label: '1', type: 'num' }, { label: '2', type: 'num' }, { label: '3', type: 'num' }, { label: '+', type: 'op' },
        { label: '0', type: 'num', span: 2 }, { label: ',', type: 'num' }, { label: '=', type: 'op' }
      ];

      body.innerHTML = `
        <div class="flex-1 flex flex-col bg-[#1c1c1e] text-white p-3 select-none">
          <div id="${winId}-calc-display" class="h-20 flex items-end justify-end px-2 pb-2 text-4xl font-light tracking-tight overflow-hidden">
            ${calcState.display}
          </div>
          <div class="flex-1 grid grid-cols-4 gap-2">
            ${buttons.map(btn => {
              const bgClass = btn.type === 'op'
                ? 'bg-[#ff9f0a] hover:bg-[#ffb340] text-white font-medium'
                : btn.type === 'func'
                  ? 'bg-[#505050] hover:bg-[#686868] text-white'
                  : 'bg-[#333333] hover:bg-[#4d4d4d] text-white';
              const spanClass = btn.span === 2 ? 'col-span-2 text-left pl-6' : 'justify-center';
              return `
                <button
                  onclick="handleCalcPress('${winId}', '${btn.label}')"
                  class="${bgClass} ${spanClass} rounded-full flex items-center text-lg active:brightness-125 transition"
                >
                  ${btn.label}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleCalcPress(winId, key) {
      const dispEl = document.getElementById(`${winId}-calc-display`);
      if (!dispEl) return;

      if (!isNaN(key)) {
        if (calcState.display === '0' || calcState.resetNext) {
          calcState.display = key;
          calcState.resetNext = false;
        } else if (calcState.display.length < 11) {
          calcState.display += key;
        }
      } else if (key === ',') {
        if (calcState.resetNext) {
          calcState.display = '0,';
          calcState.resetNext = false;
        } else if (!calcState.display.includes(',')) {
          calcState.display += ',';
        }
      } else if (key === 'AC') {
        calcState.display = '0';
        calcState.prev = null;
        calcState.op = null;
        calcState.resetNext = false;
      } else if (key === '+/-') {
        const val = parseFloat(calcState.display.replace(',', '.')) * -1;
        calcState.display = String(val).replace('.', ',');
      } else if (key === '%') {
        const val = parseFloat(calcState.display.replace(',', '.')) / 100;
        calcState.display = String(Number(val.toFixed(6))).replace('.', ',');
      } else if (['+', '−', '×', '÷'].includes(key)) {
        calcState.prev = parseFloat(calcState.display.replace(',', '.'));
        calcState.op = key;
        calcState.resetNext = true;
      } else if (key === '=' && calcState.op !== null && calcState.prev !== null) {
        const curr = parseFloat(calcState.display.replace(',', '.'));
        let res = 0;
        if (calcState.op === '+') res = calcState.prev + curr;
        if (calcState.op === '−') res = calcState.prev - curr;
        if (calcState.op === '×') res = calcState.prev * curr;
        if (calcState.op === '÷') res = curr === 0 ? 'Erro' : calcState.prev / curr;
        calcState.display = typeof res === 'number' ? String(Number(res.toFixed(6))).replace('.', ',') : res;
        calcState.prev = null;
        calcState.op = null;
        calcState.resetNext = true;
      }

      dispEl.textContent = calcState.display;
    }

      input.value = '';

      const promptLine = document.createElement('div');
      promptLine.innerHTML = `<span class="text-emerald-400 font-semibold">henrique@MacBook-Pro ~ %</span> ${raw}`;
      output.appendChild(promptLine);

      if (!raw) return;
      const [cmd, ...args] = raw.split(' ');
      let response = '';

      switch (cmd.toLowerCase()) {
        case 'help':
          response = `Comandos disponíveis:
  help      - Mostra esta lista de comandos
  ls        - Lista os arquivos
  cat       - Mostra o conteúdo de um arquivo
  last      - Últimos logins
  whoami    - Exibe o usuário atual
  date      - Exibe a data e hora do sistema
  echo      - Repete o texto informado
  neofetch  - Informações do sistema
  clear     - Limpa a tela do terminal`;
          break;
        case 'ls':
          response = `ensaios.txt   elenco.txt   ato3_paginas_novas.txt   lembrete.txt`;
          break;
        case 'whoami':
          response = `henrique.v`;
          break;
        case 'date':
          response = 'sáb 13 set 1895 21:41:07';
          break;
        case 'echo':
          response = args.join(' ');
          break;
        case 'cat': {
          const f = findFile(args[0] || '');
          response = f ? esc(f.content) : `cat: ${esc(args[0] || '')}: Arquivo ou diretório inexistente`;
          break;
        }
        case 'last':
          response = ['qui 04','sex 05','sáb 06','dom 07','seg 08','ter 09','qua 10','qui 11','sex 12','sáb 13'].map(d => `henrique  ttys001  ${d} set 03:12 - 03:12  (00:00)`).join('\n');
          break;
        case 'carcosa':
          response = 'Acesso negado.\nO segundo ato só existe para quem lê.';
          break;
        case 'clear':
          output.innerHTML = '';
          return;
        case 'neofetch':
          response = `<span class="text-sky-400 font-bold">       .:'       henrique@MacBook-Pro</span>
<span class="text-sky-400 font-bold">    __ :'__      ---------------------</span>
<span class="text-emerald-400 font-bold"> .'\`  \`-'  \`\`.   OS:</span> macOS Sequoia 15.2 Web
<span class="text-amber-400 font-bold">:          .-'   Host:</span> MacBook Pro (16-inch, 2026)
<span class="text-orange-400 font-bold">:         :      Kernel:</span> Darwin 24.2.0
<span class="text-rose-400 font-bold"> :         \`-;   Shell:</span> zsh 5.9
<span class="text-purple-400 font-bold">  \`.__.-.__.'    CPU:</span> Apple M4 Max (16 cores)
                 <span class="text-sky-400 font-bold">Memória:</span> 64 GB Unificada`;
          break;
        default:
          response = `zsh: comando não encontrado: ${cmd}`;
      }

      const resEl = document.createElement('div');
      resEl.className = 'opacity-90';
      resEl.innerHTML = response;
      output.appendChild(resEl);
      output.parentElement.scrollTop = output.parentElement.scrollHeight;
    }

    // -------------------------------------------------------------------------
    // 6. MÚSICA LO-FI (SINTETIZADOR WEB AUDIO API NATIVO - SEM URL EXTERNA)
    // -------------------------------------------------------------------------
    let lofiAudioCtx = null;
    let lofiGain = null;
    let lofiInterval = null;
    let lofiPlaying = false;
    let currentTrackIdx = 0;

    const LOFI_TRACKS = [
      { title: 'Chuva em Tóquio', artist: 'Beats para Focar • 75 BPM', chords: [[261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00], [174.61, 220.00, 261.63, 329.63], [196.00, 246.94, 293.66, 349.23]] },
      { title: 'Café da Manhã em Paris', artist: 'Acordes Suaves • 70 BPM', chords: [[293.66, 349.23, 440.00, 523.25], [196.00, 246.94, 293.66, 349.23], [261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00]] },
      { title: 'Noite Estrelada', artist: 'Synth Ambiente • 65 BPM', chords: [[164.81, 246.94, 329.63, 392.00], [146.83, 220.00, 293.66, 349.23], [130.81, 196.00, 261.63, 329.63], [146.83, 220.00, 293.66, 349.23]] }
    ];

    function mountMusic(winId, body) {
      const track = LOFI_TRACKS[currentTrackIdx];
      body.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-br from-rose-500/15 via-purple-500/10 to-indigo-500/15 text-center">
          <div class="w-28 h-28 rounded-2xl bg-gradient-to-tr from-rose-500 to-amber-500 shadow-xl flex items-center justify-center mb-4 relative">
            <div id="${winId}-eq" class="flex items-end space-x-1.5 h-10 ${lofiPlaying ? 'eq-playing' : ''}">
              <div class="w-1.5 bg-white rounded-full h-3"></div>
              <div class="w-1.5 bg-white rounded-full h-6"></div>
              <div class="w-1.5 bg-white rounded-full h-4"></div>
              <div class="w-1.5 bg-white rounded-full h-5"></div>
            </div>
          </div>
          <h3 id="${winId}-track-title" class="text-base font-bold">${track.title}</h3>
          <p id="${winId}-track-artist" class="text-xs opacity-65 mt-0.5 mb-5">${track.artist}</p>

          <div class="flex items-center space-x-5">
            <button onclick="changeLofiTrack('${winId}', -1)" class="p-2 rounded-full hover:bg-black/10 dark:hover:bg-white/10 transition">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button onclick="toggleLofiPlay('${winId}')" id="${winId}-play-btn" class="w-12 h-12 rounded-full bg-rose-500 hover:bg-rose-600 text-white flex items-center justify-center shadow-lg transition">
              ${lofiPlaying
                ? '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
                : '<svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
              }
            </button>
            <button onclick="changeLofiTrack('${winId}', 1)" class="p-2 rounded-full hover:bg-black/10 dark:hover:bg-white/10 transition">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>
          <div class="mt-4 text-[11px] opacity-55">Áudio sintetizado em tempo real via Web Audio API</div>
        </div>
      `;
    }

    function playChordStep(freqs) {
      if (!lofiAudioCtx) return;
      const now = lofiAudioCtx.currentTime;
      freqs.forEach(f => {
        const osc = lofiAudioCtx.createOscillator();
        const noteGain = lofiAudioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);

        noteGain.gain.setValueAtTime(0.001, now);
        noteGain.gain.exponentialRampToValueAtTime(0.08, now + 0.35);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.3);

        osc.connect(noteGain);
        noteGain.connect(lofiGain);
        osc.start(now);
        osc.stop(now + 2.4);
      });
    }

    function toggleLofiPlay(winId) {
      if (!lofiAudioCtx) {
        lofiAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        lofiGain = lofiAudioCtx.createGain();
        lofiGain.gain.value = (state.volume / 100) * 0.25;
        lofiGain.connect(lofiAudioCtx.destination);
      }

      if (lofiPlaying) {
        clearInterval(lofiInterval);
        lofiPlaying = false;
      } else {
        if (lofiAudioCtx.state === 'suspended') lofiAudioCtx.resume();
        lofiPlaying = true;
        let step = 0;
        const playNext = () => {
          const chords = LOFI_TRACKS[currentTrackIdx].chords;
          playChordStep(chords[step % chords.length]);
          step++;
        };
        playNext();
        lofiInterval = setInterval(playNext, 2400);
      }

      const eq = document.getElementById(`${winId}-eq`);
      const btn = document.getElementById(`${winId}-play-btn`);
      if (eq) eq.classList.toggle('eq-playing', lofiPlaying);
      if (btn) {
        btn.innerHTML = lofiPlaying
          ? '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
          : '<svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      }
    }

    function changeLofiTrack(winId, dir) {
      currentTrackIdx = (currentTrackIdx + dir + LOFI_TRACKS.length) % LOFI_TRACKS.length;
      const track = LOFI_TRACKS[currentTrackIdx];
      const titleEl = document.getElementById(`${winId}-track-title`);
      const artistEl = document.getElementById(`${winId}-track-artist`);
      if (titleEl) titleEl.textContent = track.title;
      if (artistEl) artistEl.textContent = track.artist;
    }

    // -------------------------------------------------------------------------
    // 7. CALENDÁRIO
    // -------------------------------------------------------------------------
    const CAL = {};
    function mountCalendar(winId, body) {
      CAL[winId] = { body, y: 2025, m: 8 };
      renderCal(winId);
    }
    function calNav(winId, d) {
      const c = CAL[winId];
      c.m += d;
      if (c.m > 11) { c.m = 0; c.y++; }
      if (c.m < 0) { c.m = 11; c.y--; }
      renderCal(winId);
    }
    function calToday(winId) { CAL[winId].y = 2025; CAL[winId].m = 8; renderCal(winId); }
    function calYear(winId, d) { const c = CAL[winId]; c.y = Math.max(1000, Math.min(3000, c.y + d)); renderCal(winId); }
    function calSetYear(winId, v) { const n = parseInt(v, 10); if (n >= 1001 && n <= 3001) CAL[winId].y = n - 1; renderCal(winId); }
    function renderCal(winId) {
      const c = CAL[winId], y = c.y, m = c.m;
      const names = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      const EV = {9:'Ensaio · ato 2',11:'Ensaio · ato 3',12:'Ensaio geral',13:'Récita 21:30',15:'Consulta Dra. Helena'};
      const off = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
      const sept = (m === 8 && y === 2025);
      const portas = (m === 10 && y === 1894);
      const cellCls = 'min-h-[60px] border-b border-r border-black/5 dark:border-white/10';
      let cells = '';
      for (let i = 0; i < off; i++) cells += `<div class="${cellCls}"></div>`;
      for (let d = 1; d <= days; d++) {
        cells += `<div class="${cellCls} p-1 text-[11px] overflow-hidden">
          <span class="inline-flex w-6 h-6 items-center justify-center rounded-full ${sept && d === 13 ? 'bg-red-500 text-white font-bold' : ''}">${d}</span>
          ${portas && d === 19 ? `<div class="mt-0.5 px-1 py-0.5 rounded bg-amber-500/20 text-amber-600 dark:text-amber-400 border-l-2 border-amber-500 leading-tight">O mensageiro não volta</div>` : ''}
          ${sept && EV[d] ? `<div class="mt-0.5 px-1 py-0.5 rounded bg-red-500/15 text-red-500 border-l-2 border-red-500 truncate">${EV[d]}</div>` : ''}
          ${sept && d >= 4 && d <= 13 ? `<div class="mt-0.5 px-1 py-0.5 rounded bg-black/10 dark:bg-white/10 opacity-70 border-l-2 border-gray-400 truncate">03:12 (sem título)</div>` : ''}
        </div>`;
      }
      const weekDays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const btn = 'w-7 h-7 rounded-md bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-base leading-none';
      c.body.innerHTML = `
        <div class="flex-1 flex flex-col p-3 bg-white/75 dark:bg-[#1e1e22]/85 overflow-hidden">
          <div class="flex items-center justify-between mb-2 px-1">
            <h2 class="text-lg font-bold flex items-center flex-wrap gap-x-2">${names[m]} <span class="inline-flex items-center gap-1 font-normal opacity-70"><button onclick="calYear('${winId}', -1)" class="w-6 h-6 rounded-md bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-sm leading-none" aria-label="Ano anterior">‹</button><input type="number" min="1000" max="3000" value="${y + 1}" onchange="calSetYear('${winId}', this.value)" class="w-16 text-center bg-transparent border-b border-black/20 dark:border-white/20 focus:outline-none focus:border-blue-500 font-normal" aria-label="Ano"><button onclick="calYear('${winId}', 1)" class="w-6 h-6 rounded-md bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-sm leading-none" aria-label="Próximo ano">›</button></span></h2>
            <div class="flex items-center gap-1">
              <button onclick="calNav('${winId}', -1)" class="${btn}" aria-label="Mês anterior">‹</button>
              <button onclick="calToday('${winId}')" class="px-2.5 h-7 rounded-md bg-red-500/15 text-red-500 text-xs font-semibold">Hoje</button>
              <button onclick="calNav('${winId}', 1)" class="${btn}" aria-label="Próximo mês">›</button>
            </div>
          </div>
          <div class="grid grid-cols-7 text-center text-xs font-semibold opacity-55 mb-1">${weekDays.map(w => `<div>${w}</div>`).join('')}</div>
          <div class="grid grid-cols-7 flex-1 overflow-y-auto content-start border-t border-l border-black/5 dark:border-white/10">${cells}</div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 8. AJUSTES DO SISTEMA (SYSTEM SETTINGS)
    // -------------------------------------------------------------------------
    function mountSettings(winId, body) {
      body.innerHTML = `
        <div class="flex-1 overflow-y-auto p-5 space-y-6 bg-white/60 dark:bg-[#1c1c1f]/75 text-[13px]">
          <!-- Perfil -->
          <div class="flex items-center space-x-3.5 p-3.5 rounded-2xl bg-black/[0.04] dark:bg-white/[0.05] border border-black/5 dark:border-white/10">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 text-white flex items-center justify-center text-xl font-bold">H</div>
            <div>
              <div class="font-bold text-sm">Henrique Vasconcelos</div>
              <div class="text-xs opacity-65">ID Apple, iCloud, Mídia e Compras</div>
            </div>
          </div>

          <!-- Aparência -->
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider opacity-60 mb-2">Aparência</h3>
            <div class="p-3.5 rounded-2xl bg-black/[0.04] dark:bg-white/[0.05] border border-black/5 dark:border-white/10 flex items-center justify-between">
              <div>
                <div class="font-medium">Modo Escuro</div>
                <div class="text-xs opacity-60">Alterna entre o tema claro e escuro em todo o macOS</div>
              </div>
              <input id="settings-dark-toggle" type="checkbox" ${state.darkMode ? 'checked' : ''} onchange="toggleDarkMode()" class="w-5 h-5 accent-blue-500 cursor-pointer" />
            </div>
          </div>

          <!-- Papel de Parede -->
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider opacity-60 mb-2">Imagem de Fundo</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              ${WALLPAPERS.map(wp => `
                <button
                  onclick="setWallpaper('${wp.id}')"
                  class="group text-left rounded-xl overflow-hidden border-2 ${state.wallpaper === wp.id ? 'border-blue-500' : 'border-transparent'} hover:border-blue-400 transition"
                >
                  <div class="h-20 w-full ${wp.id}"></div>
                  <div class="p-2 text-xs font-medium bg-black/5 dark:bg-white/5 truncate">${wp.name}</div>
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Tamanho do Dock -->
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider opacity-60 mb-2">Dock e Barra de Menus</h3>
            <div class="p-3.5 rounded-2xl bg-black/[0.04] dark:bg-white/[0.05] border border-black/5 dark:border-white/10">
              <div class="flex justify-between text-xs font-medium mb-2">
                <span>Tamanho dos Ícones do Dock</span>
                <span id="settings-dock-val">${state.dockSize}px</span>
              </div>
              <input
                type="range"
                min="28"
                max="64"
                value="${state.dockSize}"
                oninput="updateDockSize(this.value)"
                class="w-full accent-blue-500 cursor-pointer"
              />
            </div>
          </div>
        </div>
      `;
    }

    function updateDockSize(val) {
      state.dockSize = parseInt(val, 10);
      const label = document.getElementById('settings-dock-val');
      if (label) label.textContent = val + 'px';
      renderDock();
    }

    // -------------------------------------------------------------------------
    // 9. LIXEIRA (TRASH)
    // -------------------------------------------------------------------------
    function mountTrash(winId, body) {
      body.innerHTML = `
        <div class="flex-1 flex flex-col bg-white/70 dark:bg-[#1e1e22]/85">
          <div class="px-4 py-2.5 border-b border-black/10 dark:border-white/10 flex items-center justify-between text-xs">
            <span class="opacity-70">${state.trashItems.length} itens na Lixeira</span>
            <button onclick="emptyTrash('${winId}')" class="px-3 py-1 rounded-md bg-black/10 dark:bg-white/10 hover:bg-red-500 hover:text-white font-medium transition">
              Esvaziar
            </button>
          </div>
          <div id="${winId}-trash-list" class="flex-1 p-4 space-y-2 overflow-y-auto">
            ${renderTrashListHtml()}
          </div>
        </div>
      `;
    }

    function renderTrashListHtml() {
      if (state.trashItems.length === 0) {
        return `<div class="h-full flex flex-col items-center justify-center opacity-50 text-xs py-12">A Lixeira está vazia</div>`;
      }
      return state.trashItems.map(item => `
        <details class="rounded-xl bg-black/[0.04] dark:bg-white/[0.05] text-xs">
          <summary class="flex items-center justify-between p-2.5 cursor-pointer"><span class="font-medium">${item.name}</span><span class="opacity-60">${item.size} • ${item.date}</span></summary>
          <div class="px-3 pb-3 whitespace-pre-line selectable opacity-90">${esc(item.content || '')}</div>
        </details>
      `).join('');
    }

    function emptyTrash(winId) {
      showToast('Não foi possível esvaziar a Lixeira: “ultima.txt” está em uso.');
    }

    // =========================================================================
    // INICIALIZAÇÃO
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderDesktopIcons();
      renderDock();
    });
  </script>
</body>
